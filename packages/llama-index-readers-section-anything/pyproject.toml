[build-system]
requires = ["setuptools>=77"]  # SPDX licence expression and license-files
build-backend = "setuptools.build_meta"

[project]
name = "llama-index-readers-section-anything"
version = "0.1.0"
description = "LlamaIndex reader for Section Anything: one Document per PDF section, with its heading path, pages and character span."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "The Section Anything Authors" }]
keywords = ["llama-index", "llamaindex", "reader", "pdf", "sections", "headings", "rag", "chunking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: General",
    "Typing :: Typed",
]
dependencies = [
    "section-anything>=0.1.1,<0.2",  # uses its body export (section_anything.export)
    "llama-index-core>=0.13,<0.15",
]

[project.urls]
Homepage = "https://github.com/Omniwot/section-anything/tree/main/packages/llama-index-readers-section-anything"
Repository = "https://github.com/Omniwot/section-anything"
Issues = "https://github.com/Omniwot/section-anything/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

# llama_index and llama_index.readers are namespace packages shared with llama-index-core:
# they must not get an __init__.py here.
[tool.setuptools.packages.find]
where = ["src"]
include = ["llama_index.readers.section_anything*"]
namespaces = true

[tool.setuptools.package-data]
"llama_index.readers.section_anything" = ["py.typed"]

# The section LlamaIndex's own integration packages carry.
[tool.llamahub]
contains_example = false
import_path = "llama_index.readers.section_anything"

[tool.llamahub.class_authors]
SectionAnythingReader = "Omniwot"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "ASYNC"]
ignore = ["E501", "E731"]
