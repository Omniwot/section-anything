[build-system]
requires = ["setuptools>=77"]  # SPDX licence expression and license-files
build-backend = "setuptools.build_meta"

[project]
name = "lightrag-section-anything"
version = "0.1.0.dev1"
description = "Section Anything PDF parser engines for LightRAG: accurate headings for heading-aware chunking, with a cost/accuracy dial."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "The Section Anything Authors" }]
dependencies = [
    "section-anything>=0.1,<0.2",
    "lightrag-hku>=1.5.7,<1.7",
]

[project.optional-dependencies]
test = ["pytest"]

[project.entry-points."lightrag.parsers"]
sectionany = "lightrag_section_anything.plugin:register_parsers"

[tool.setuptools.packages.find]
where = ["src"]
