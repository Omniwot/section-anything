[build-system]
requires = ["setuptools>=77"]  # SPDX licence expression and license-files
build-backend = "setuptools.build_meta"

[project]
name = "lightrag-section-anything"
version = "0.1.1"
description = "Section Anything PDF parser engines for LightRAG: accurate headings for heading-aware chunking, with a cost/accuracy dial."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "The Section Anything Authors" }]
keywords = ["lightrag", "parser", "plugin", "pdf", "sections", "headings", "rag", "chunking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "section-anything>=0.1.4,<0.2",  # body export (0.1.1); Claude models with ANTHROPIC_API_KEY (0.1.4)
    "lightrag-hku>=1.5.7,<1.7",  # lightrag.parsers entry points and NativeParserBase, from 1.5.7
]

[project.urls]
Homepage = "https://github.com/Omniwot/section-anything/tree/main/packages/lightrag-section-anything"
Repository = "https://github.com/Omniwot/section-anything"
Issues = "https://github.com/Omniwot/section-anything/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."lightrag.parsers"]
sectionany = "lightrag_section_anything.plugin:register_parsers"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "ASYNC"]
ignore = ["E501", "E731"]
