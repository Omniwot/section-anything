name: Release integrations

# Builds one integration package and publishes it to PyPI when its tag is pushed:
#   langchain-section-anything-v0.1.0            -> packages/langchain-section-anything
#   llama-index-readers-section-anything-v0.1.0  -> packages/llama-index-readers-section-anything
#   lightrag-section-anything-v0.1.0             -> packages/lightrag-section-anything
# PyPI trusted publishing: no API token is stored in this repository (see RELEASING.md).
on:
  push:
    tags:
      - "langchain-section-anything-v*"
      - "llama-index-readers-section-anything-v*"
      - "lightrag-section-anything-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.tag.outputs.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag names a package and matches its version
        id: tag
        run: |
          pkg="${GITHUB_REF_NAME%-v*}"
          ver="${GITHUB_REF_NAME##*-v}"
          case "$pkg" in
            langchain-section-anything|llama-index-readers-section-anything|lightrag-section-anything) ;;
            *) echo "tag $GITHUB_REF_NAME names no integration package"; exit 1 ;;
          esac
          v=$(python -c "import sys, tomllib; print(tomllib.load(open(sys.argv[1], 'rb'))['project']['version'])" "packages/$pkg/pyproject.toml")
          test "$v" = "$ver" || { echo "tag $GITHUB_REF_NAME does not match $pkg version $v"; exit 1; }
          echo "package=$pkg" >> "$GITHUB_OUTPUT"
      - run: python -m pip install build "twine>=6.1"
      - run: python -m build "packages/$PACKAGE" --outdir dist
        env:
          PACKAGE: ${{ steps.tag.outputs.package }}
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.build.outputs.package }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          verbose: true  # PyPI's reason for a rejected upload is only in the response body
