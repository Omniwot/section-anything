name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt -e ../packages/section-anything
      - name: Lint
        run: ruff check app tests
      - name: Test
        env:
          ENVIRONMENT: development
          SECRET_KEY: test-secret-key-not-for-prod
          DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/app
          OPENAI_API_KEY: test-key
          ALLOWED_ORIGINS: http://localhost:5173
        run: pytest -q

  library:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/section-anything
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[test]" ruff build twine
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
      - name: Build
        run: python -m build && twine check dist/*

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t app-backend -f backend/Dockerfile .
