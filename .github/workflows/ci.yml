name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt -e ../packages/section-anything
      - name: Lint
        run: ruff check app tests
      - name: Test
        env:
          ENVIRONMENT: development
          SECRET_KEY: test-secret-key-not-for-prod
          DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/app
          OPENAI_API_KEY: test-key
          ALLOWED_ORIGINS: http://localhost:5173
        run: pytest -q

  library:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/section-anything
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[test]" ruff build twine
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
      - name: Build
        run: python -m build && twine check dist/*

  integrations:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [langchain-section-anything, llama-index-readers-section-anything, lightrag-section-anything]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ../section-anything -e ".[test]" ruff build "twine>=6.1"
      - name: Lint
        run: ruff check src tests
      - name: Shared helper copies match
        run: cmp ../langchain-section-anything/src/langchain_section_anything/_sections.py ../llama-index-readers-section-anything/src/llama_index/readers/section_anything/_sections.py
      # The LightRAG end-to-end tests read the PDF in SECTIONANY_TEST_PDF and skip without one: write
      # the two-page test PDF the other packages' tests use (no download, no dependencies).
      - name: Test PDF
        if: matrix.package == 'lightrag-section-anything'
        run: |
          python - <<'EOF'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, "../langchain-section-anything/tests")
          from conftest import body, write_pdf
          path = write_pdf(Path(os.environ["RUNNER_TEMP"]) / "paper.pdf", [
              [("A Study of Sectioning", 20, True), ("1 Introduction", 14, True), *body(5),
               ("1.1 Scope", 12, True), *body(4)],
              [("2 Methods", 14, True), ("2.1 Data", 12, True), *body(5), ("3 Results", 14, True), *body(4)],
          ])
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SECTIONANY_TEST_PDF={path}\n")
          EOF
      - name: Test
        run: pytest -q -rs
      - name: Build
        run: python -m build && twine check --strict dist/*

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t app-backend -f backend/Dockerfile .
